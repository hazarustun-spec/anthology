name: Margin
options:
  bundleIdPrefix: com.marginnotes
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  MarginKit:
    path: ../MarginKit
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: $(MARGIN_BUNDLE_ID)
    PRODUCT_NAME: Anthology
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Anthology
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Margin:
    type: application
    platform: macOS
    sources: [Margin, Shared]
    dependencies:
      - package: MarginKit
        product: MarginCore
    info:
      path: Margin/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.productivity
        MarginICloudContainer: iCloud.$(MARGIN_BUNDLE_ID)
        NSUbiquitousContainers:
          iCloud.${MARGIN_BUNDLE_ID}:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Anthology
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        INFOPLIST_FILE: Margin/Info.plist
        CODE_SIGN_ENTITLEMENTS: Margin/Margin.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Embed anthology-mcp helper
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/../MarginKit"
          SWIFT() { env -i PATH="/usr/bin:/bin:/usr/sbin:/sbin" HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" xcrun swift "$@"; }
          SWIFT build -c release --product anthology-mcp
          BIN="$(SWIFT build -c release --show-bin-path)"
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$DEST"
          rm -f "$DEST/anthology-mcp"
          cp "$BIN/anthology-mcp" "$DEST/anthology-mcp"
          codesign --force --options runtime --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/anthology-mcp" || true

  MarginMobile:
    type: application
    platform: iOS
    sources: [MarginMobile, Shared]
    dependencies:
      - package: MarginKit
        product: MarginCore
    info:
      path: MarginMobile/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSFaceIDUsageDescription: Anthology uses Face ID to unlock your notes.
        ITSAppUsesNonExemptEncryption: false
        MarginICloudContainer: iCloud.$(MARGIN_BUNDLE_ID)
        NSUbiquitousContainers:
          iCloud.${MARGIN_BUNDLE_ID}:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Anthology
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        INFOPLIST_FILE: MarginMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: MarginMobile/MarginMobile.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
